services:
  pipeline:
    build:
      context: .
      dockerfile: docker/Dockerfile
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - venv/
            - data/
            - models/
            - .git/
        - action: rebuild
          path: pyproject.toml
    env_file:
      - .env.example
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./outputs:/app/outputs
    command: ["python", "scripts/benchmark.py", "--help"]
